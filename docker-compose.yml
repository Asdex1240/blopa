name: blopa

services:
  ollama:
    image: ollama/ollama:latest
    profiles: [core]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      LLAMA_ARG_CACHE_RAM: 1024

  blopa:
    build:
      context: .
      target: base
    profiles: [core]
    restart: unless-stopped
    env_file: .env
    depends_on:
      - ollama
    ports:
      - "${BLOPA_BIND:-127.0.0.1}:${BLOPA_PORT:-8000}:8000"
    volumes:
      - blopa_data:/data
    stdin_open: true
    tty: true

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.7
    profiles: [n8n]
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: ${BLOPA_TIMEZONE:-America/Monterrey}
      TZ: ${BLOPA_TIMEZONE:-America/Monterrey}
      N8N_HOST: localhost
      N8N_PORT: 5678
      WEBHOOK_URL: http://n8n:5678/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "127.0.0.1:5678:5678"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.1
    profiles: [home]
    restart: unless-stopped
    environment:
      TZ: ${BLOPA_TIMEZONE:-America/Monterrey}
    volumes:
      - ha_config:/config
      - ./homeassistant/configuration.yaml:/config/configuration.yaml:ro
    ports:
      - "127.0.0.1:8123:8123"

  whisper:
    build:
      context: ./voice
    profiles: [voice]
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${BLOPA_WHISPER_MODEL:-small}
      WHISPER_COMPUTE_TYPE: int8
    volumes:
      - whisper_models:/models

  tests:
    build:
      context: .
      target: dev
    profiles: [test]
    network_mode: none
    volumes:
      - ./app:/blopa/app:ro
      - ./tests:/blopa/tests:ro

  web-dev:
    image: node:22-slim
    profiles: [dev]
    working_dir: /web
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --port 5173"
    environment:
      BLOPA_API_URL: http://blopa:8000
    volumes:
      - ./web:/web
      - web_node_modules:/web/node_modules
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  blopa_data:
  ollama_data:
  n8n_data:
  ha_config:
  whisper_models:
  web_node_modules:
